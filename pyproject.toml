[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timeseriesflow"
version = "0.1.0"
description = "Entity-based time-series processing framework for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "TimeSeriesFlow Contributors" },
]
keywords = [
    "timeseries",
    "time-series",
    "entity",
    "processing",
    "pandas",
    "data-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "psutil>=5.9",
    "rich>=13.0",
    "typer>=0.9",
]

[project.optional-dependencies]
parquet = [
    "pyarrow>=14",
]
dev = [
    "mypy>=1.8",
    "pandas-stubs>=2.0",
    "pyarrow>=14",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "types-psutil>=5.9",
]

[project.scripts]
tsflow = "timeseriesflow.cli.main:main"
timeseriesflow = "timeseriesflow.cli.main:main"

[project.urls]
Homepage = "https://github.com/baban9/timeseriesflow"
Documentation = "https://github.com/baban9/timeseriesflow#readme"
Repository = "https://github.com/baban9/timeseriesflow"
Issues = "https://github.com/baban9/timeseriesflow/issues"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["timeseriesflow", "adaptiveforecast"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
packages = ["timeseriesflow", "adaptiveforecast"]

[tool.coverage.run]
source = ["timeseriesflow", "adaptiveforecast"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
