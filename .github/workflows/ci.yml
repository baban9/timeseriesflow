name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Verify package imports
        run: |
          python -c "import timeseriesflow; import adaptiveforecast; print('timeseriesflow', timeseriesflow.__version__); print('adaptiveforecast', adaptiveforecast.__version__)"

      - name: Ruff
        run: ruff check src tests examples

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest

      - name: Example smoke tests
        run: |
          python examples/architecture_selection.py
          python examples/adaptiveforecast_profile.py
          python examples/basic_pipeline.py
